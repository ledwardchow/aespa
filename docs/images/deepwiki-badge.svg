<svg xmlns="http://www.w3.org/2000/svg" width="105" height="20" role="img" aria-label="Ask DeepWiki">
  <title>Ask DeepWiki</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
    <stop offset="1" stop-opacity=".08"/>
  </linearGradient>
  <clipPath id="round"><rect width="105" height="20" rx="3"/></clipPath>
