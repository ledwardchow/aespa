name: Publish container images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: ver
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AESPA
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aespa:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aespa:latest
            ghcr.io/${{ github.repository_owner }}/aespa:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aespa:latest

      - name: Publish Python executor
        uses: docker/build-push-action@v6
        with:
          context: runtime/python-executor
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aespa-python-executor:0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/aespa-python-executor:latest
            ghcr.io/${{ github.repository_owner }}/aespa-python-executor:0.1
            ghcr.io/${{ github.repository_owner }}/aespa-python-executor:latest
