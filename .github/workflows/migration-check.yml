name: Check database migrations

on:
  push:
  pull_request:

jobs:
  migration-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -n 0 tests/infra/test_db_migration.py tests/test_sast_association_migration.py
      - name: Check existing migration files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_migration_history.py --base "$BASE_SHA"
