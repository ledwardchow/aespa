[project]
name = "aespa"
version = "0.7.20261009.5"
description = "AI-Enabled Security Pentesting Agent"
authors = [
    { name = "Edward Chow", email = "ledwardchow@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "prance>=26.7.19.0",
    "github-copilot-sdk>=1.0.16",
    "droid-sdk>=0.5.0",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-php>=0.24.1,<0.25",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "tree-sitter-ruby>=0.23.1,<0.24",
]

[project.scripts]
aespa = "aespa:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # SQLModel domain classes named `Test*` (e.g. TestRun) collide with pytest's
    # test-class naming heuristic; they aren't tests. Pure noise.
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 (line length) is not enforced — the codebase uses a wider line convention
# than the 88-char default and reformatting it wholesale is not worthwhile.
ignore = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
